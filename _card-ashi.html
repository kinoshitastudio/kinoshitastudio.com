<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見本名刺（ヨシ細工の工房 ashi）</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 「ヨシ細工の工房 ashi」の名刺。
     ⭐ ロゴは細い縦線の束＝葦の群れ。名刺では【その線を紙の下の端まで伸ばして】、
        切れていないことを見せる。刈った葦ではなく、生えている葦のつもり。
     🔴 色は墨1色。紙は生成り。横線は1本も引かない（縦の線だけで組む）。
     縦型 55×91mm。*/
  *{box-sizing:border-box;margin:0;padding:0}
  body{ background:#555; padding:40px; font-family:'Noto Sans JP','Inter',sans-serif }
  .board{ width:1500px; height:1000px; background:#e9e5da; margin:0 auto; position:relative;
    overflow:hidden; display:flex; align-items:center; justify-content:center; gap:96px; color:#211e19 }
  .card{ width:414px; height:685px; position:relative; overflow:hidden; background:#f5f1e6;
    box-shadow:0 24px 44px rgba(60,52,32,.2), 0 2px 5px rgba(60,52,32,.1) }

  .face .mk{ position:absolute; left:50%; top:148px; transform:translateX(-50%); width:270px }
  .face .mk svg{ width:100%; height:auto; display:block }
  /* 葦を紙の下端まで伸ばす */
  .face .grass{ position:absolute; left:50%; top:386px; bottom:0; transform:translateX(-50%);
    width:270px; display:flex; justify-content:center; align-items:flex-start; gap:4.6px }
  .face .grass i{ display:block; flex:none; width:1.5px; background:#211e19; opacity:.78 }
  .face .jp{ position:absolute; left:0; right:0; top:330px; text-align:center; font-size:13px;
    letter-spacing:.42em; text-indent:.42em }
  .face .en{ position:absolute; left:0; right:0; top:364px; text-align:center; font-size:9.5px;
    letter-spacing:.3em; color:#7d7465; text-indent:.3em }

  .back{ padding:58px 44px 0 }
  .back .nm{ font-size:26px; font-weight:700; letter-spacing:.05em; line-height:1.3 }
  .back .nm em{ font-style:normal; display:block; font-size:11px; font-weight:500;
    letter-spacing:.24em; color:#7d7465; margin-top:9px; font-family:'Inter' }
  .back .ttl{ font-size:12px; letter-spacing:.18em; color:#4a443a; margin-top:18px }
  .back .body{ font-size:11.5px; line-height:2.1; color:#36312a; margin-top:36px }
  .back .tel{ font-size:16px; font-weight:600; letter-spacing:.06em; margin-top:22px; font-family:'Inter' }
  .back .web{ font-size:11px; letter-spacing:.08em; color:#4a443a; margin-top:3px; font-family:'Inter' }
  .back .grass{ position:absolute; right:40px; bottom:0; width:120px; height:210px;
    display:flex; justify-content:center; align-items:flex-start; gap:4.6px }
  .back .grass i{ display:block; flex:none; width:1.3px; background:#211e19; opacity:.5 }
  .lbl{ position:absolute; font-size:13px; letter-spacing:.14em; color:#a7a39a; font-weight:600 }
  .credit{ position:absolute; left:30px; bottom:16px; font-size:12px; letter-spacing:.12em; color:#b4b0a7 }
</style>
</head>
<body>
<div class="board">
  <span class="lbl" style="left:30px; top:24px">BUSINESS CARD　／　55 × 91 mm</span>

  <div class="card face">
    <div class="mk"><svg viewBox="-6 -10 734.8746449285236 440"><path d="M51.428356786395355 248.5721440453488 L0 420 h3.2 L54.62835678639536 248.5721440453488 z" fill="#231f20"/><path d="M93.01345055210672 202.63429113350898 L27.803737892159415 420 h3.787444127305686 L96.80089467941241 202.63429113350898 z" fill="#231f20"/><path d="M127.86529187780653 170.6107891690358 L53.04852862851727 420 h4.521836050833636 L132.38712792864015 170.6107891690358 z" fill="#231f20"/><path d="M164.2847685183014 125.73307126574952 L76.00468989802627 420 h4.946995491958824 L169.23176401026024 125.73307126574952 z" fill="#231f20"/><path d="M193.6079775335769 101.39328341452585 L98.02596255793466 420 h6.494967722936086 L200.10294525651298 101.39328341452585 z" fill="#231f20"/><path d="M219.00380616537865 90.9167732982383 L120.27883815485012 420 h7.088231736264747 L226.09203790164338 90.9167732982383 z" fill="#231f20"/><path d="M255.41465861032157 52.2833586193027 L145.0996661961124 420 h7.458456110535329 L262.8731147208569 52.2833586193027 z" fill="#231f20"/><path d="M274.7735582103013 68.15574965454891 L169.22028310666596 420 h9.053660957475216 L283.8272191677765 68.15574965454891 z" fill="#231f20"/><path d="M302.2806607523564 49.56827200359248 L191.15114235343415 420 h8.04010482752896 L310.32076557988535 49.56827200359248 z" fill="#231f20"/><path d="M338.4435710809056 -3.939913570226963 L211.26159700983754 420 h8.615491774070804 L347.05906285497645 -3.939913570226963 z" fill="#231f20"/><path d="M358.5444004005218 -0.739646247984183 L232.32250652612652 420 h9.454507066392857 L367.9989074669146 -0.739646247984183 z" fill="#231f20"/><path d="M369.88289933750264 32.19719346323262 L253.54205737647243 420 h8.844524597905648 L378.7274239354083 32.19719346323262 z" fill="#231f20"/><path d="M401.9508150787034 -11.776581148570756 L272.4178407341322 420 h9.98116622935544 L411.9319813080589 -11.776581148570756 z" fill="#231f20"/><path d="M420.3012554536472 -5.408567505799681 L292.6786852019073 420 h10.052654380464721 L430.3539098341119 -5.408567505799681 z" fill="#231f20"/><path d="M443.9368550760635 -16.611193164414487 L312.9534971267392 420 h10.596840074161912 L454.5336951502254 -16.611193164414487 z" fill="#231f20"/><path d="M458.68195592375554 3.507304095036659 L333.73414715226653 420 h9.857340977926127 L468.53929690168167 3.507304095036659 z" fill="#231f20"/><path d="M482.16911718408244 1.656622831729237 L356.6661040336012 420 h8.88173442547199 L491.05085160955446 1.656622831729237 z" fill="#231f20"/><path d="M490.2233035848054 51.214171172688 L379.5875549366118 420 h8.726494871801265 L498.9497984566067 51.214171172688 z" fill="#231f20"/><path d="M509.6516335479131 61.758008370758716 L402.17903605914074 420 h8.296976347502028 L517.9486098954152 61.758008370758716 z" fill="#231f20"/><path d="M534.2551766594222 46.98808639792202 L422.3516025787988 420 h8.112129014589364 L542.3673056740115 46.98808639792202 z" fill="#231f20"/><path d="M555.0180681791705 54.98302517657885 L445.51297573214424 420 h6.624020992214907 L561.6420891713855 54.98302517657885 z" fill="#231f20"/><path d="M567.0712549467501 92.62894592624394 L468.8599387246233 420 h6.207115707424787 L573.278370654175 92.62894592624394 z" fill="#231f20"/><path d="M586.2354632646776 106.3970417398566 L492.15457578663455 420 h5.685364214243386 L591.920827478921 106.3970417398566 z" fill="#231f20"/><path d="M599.0727921845576 144.58322093524373 L516.4477584651306 420 h4.286315833420784 L603.3591080179783 144.58322093524373 z" fill="#231f20"/><path d="M613.4704990545663 181.1796197137007 L541.8243849686766 420 h3.893359008469673 L617.3638580630361 181.1796197137007 z" fill="#231f20"/><path d="M620.0961613548476 249.6795757004645 L569.000034064987 420 h3.2 L623.2961613548476 249.6795757004645 z" fill="#231f20"/></svg></div>
    <div class="jp">ヨ シ 細 工 の 工 房</div>
    <div class="en">A S H I　／　滋 賀 ・ 近 江 八 幡</div>
    <div class="grass" id="g1"></div>
  </div>

  <div class="card back">
    <div class="nm">芦田 はる<em>A S H I D A 　 H A R U</em></div>
    <div class="ttl">つ く り 手</div>
    <div class="body">
      〒520-0000<br>
      滋賀県近江八幡市〇〇 1-2-3<br>
      西の湖のそば<br><br>
      刈るのは冬だけです。<br>
      見学は、刈りの時期を外してください。
    </div>
    <div class="tel">0748-00-0000</div>
    <div class="web">ASHI-YOSHI.JP</div>
    <div class="grass" id="g2"></div>
  </div>

</div>
<script>
// 葦。1本ずつ長さを変えて、下の端まで伸ばす
for(const [id,n,h0,h1] of [['g1',44,232,299],['g2',20,150,210]]){
  const el=document.getElementById(id); let s='';
  for(let i=0;i<n;i++){ const t=i/(n-1), r=Math.sin(t*Math.PI);
    s+='<i style="height:'+(h0+r*(h1-h0)+Math.random()*10).toFixed(0)+'px"></i>'; }
  el.innerHTML=s;
}
</script>
</body>
</html>
