<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見本ロゴ（比良製菓）</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Noto+Sans+JP:wght@500;700&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  /* 架空の会社「比良製菓（hira）」のロゴ。同じ太さの線1本で書いた小文字。h の上だけ山（比良山）の形にのぼる */
  *{box-sizing:border-box;margin:0;padding:0}
  body{ background:#555; padding:40px; font-family:'Noto Sans JP',sans-serif }
  .board{ width:1500px; height:1000px; background:#fff; margin:0 auto; position:relative; overflow:hidden; display:grid; grid-template-columns:1fr }
  .main{ display:flex; align-items:center; justify-content:center;  position:relative }
  .side{ display:grid; grid-template-rows:1fr 1fr 1fr }
  .side>div{ display:flex; align-items:center; justify-content:center; border-bottom:1px solid #eee; position:relative }
  .lbl{ position:absolute; font-family:'Inter'; font-size:13px; letter-spacing:.14em; color:#999 }
  .since{ font-family:'EB Garamond',serif; font-size:30px; letter-spacing:.04em; color:#111 }
  .credit{ position:absolute; left:30px; bottom:16px; font-family:'Inter'; font-size:12px; letter-spacing:.12em; color:#bbb }
</style>
</head>
<body>
<div class="board">
  <svg width="0" height="0" style="position:absolute"><defs>
    <g id="hira" fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
      <!-- h：縦棒の頭が山の稜線になって、右へ下りてアーチに -->
      <path d="M30 330 V150 C 30 90, 60 40, 110 20"/>
      <path d="M30 230 C 30 180, 70 160, 105 160 C 145 160, 170 185, 170 230 V330"/>
      <!-- i：点なしの短い棒 -->
      <path d="M250 175 V330"/>
      <!-- r：棒と小さな肩 -->
      <path d="M330 330 V230 C 330 190, 360 172, 400 175"/>
      <!-- a：ひらいた丸＋棒 -->
      <path d="M590 230 C 590 190, 560 170, 525 170 C 485 170, 460 200, 460 250 C 460 300, 485 330, 525 330 C 560 330, 590 305, 590 270"/>
      <path d="M590 180 V330"/>
    </g>
  </defs></svg>

  <div class="main"><span class="lbl" style="left:30px;top:24px">MAIN</span>
    <div style="position:relative">
      <svg width="620" height="360" viewBox="0 0 630 360"><use href="#hira" stroke="#111"/></svg>
      <div class="since" style="position:absolute;right:0;bottom:-48px">since 1958</div>
    </div>
  </div>
  <div class="credit">自主制作 / Kinoshita Studio ── 架空の会社です（比良製菓）</div>
</div>
</body>
</html>
