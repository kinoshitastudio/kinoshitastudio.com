<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見本名刺（焼菓子 nami）</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 架空の「焼菓子 nami」の名刺。
     ⭐ ロゴの波を【1色の面】にして裏から回り込ませる。形は焼いた菓子の縁のつもり。
     🔴 色は地（生成り）＋1色だけ。字は小文字の細ゴシックで小さく、面に語らせる。
     横型 91×55mm。*/
  *{box-sizing:border-box;margin:0;padding:0}
  body{ background:#555; padding:40px; font-family:'Inter','Noto Sans JP',sans-serif }
  .board{ width:1500px; height:1000px; background:#efece4; margin:0 auto; position:relative;
    overflow:hidden; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:58px; color:#2b2621 }

  /* 91×55mm を 685×414px で */
  .card{ width:685px; height:414px; background:#f7f3e9; position:relative; overflow:hidden;
    box-shadow:0 22px 40px rgba(40,32,20,.18), 0 2px 5px rgba(40,32,20,.10) }

  /* ── 表：焼き色の面を1つ ── */
  .face .mk{ position:absolute; right:48px; bottom:98px; width:272px }
  .face .mk svg{ width:100%; height:auto; display:block }
  .face .rule{ position:absolute; right:48px; bottom:74px; width:272px; height:5px; background:#2b2621 }
  .face .jp{ position:absolute; right:48px; bottom:40px; font-family:'Noto Sans JP'; font-weight:500;
    font-size:13px; letter-spacing:.34em; color:#6b5e4d }
  .face .web{ position:absolute; left:32px; top:32px; writing-mode:vertical-rl;
    font-size:10.5px; letter-spacing:.26em; font-weight:600; color:#f7f3e9 }

  /* ── 裏 ── */
  .back{ padding:52px 54px 0 }
  .back .nm{ font-family:'Noto Sans JP'; font-weight:700; font-size:25px; letter-spacing:.04em;
    line-height:1.3 }
  .back .nm em{ font-style:normal; display:block; font-size:12px; font-weight:500;
    letter-spacing:.24em; color:#8a7b66; margin-top:8px }
  .back .rule{ width:76px; height:4px; background:#8a5a2b; margin:16px 0 0 }
  .back .ttl{ font-family:'Noto Sans JP'; font-size:12.5px; font-weight:500; letter-spacing:.14em;
    color:#5c5146; margin-top:20px }
  .back .cols{ display:flex; gap:46px; margin-top:26px }
  .back .adr{ font-family:'Noto Sans JP'; font-size:12px; line-height:1.95; color:#413a32 }
  .back .adr b{ font-weight:500 }
  .back .cnt{ font-size:12.5px; line-height:1.95; color:#413a32; letter-spacing:.02em }
  .back .cnt b{ display:block; font-size:15px; font-weight:600; letter-spacing:.06em; color:#2b2621 }
  .back .wave{ position:absolute; right:0; bottom:0; width:300px; opacity:.5 }
  .back .wave svg{ width:100%; height:auto; display:block }

  .lbl{ position:absolute; font-size:13px; letter-spacing:.14em; color:#a39b8c; font-weight:600 }
  .credit{ position:absolute; left:30px; bottom:16px; font-size:12px; letter-spacing:.12em; color:#b3aa9a }
</style>
</head>
<body>
<div class="board">
  <span class="lbl" style="left:30px; top:24px">BUSINESS CARD　／　91 × 55 mm</span>

  <!-- 表 -->
  <div class="card face">
    <!-- 🔴 四角でなく、焼いた縁のような形で1色だけ置く -->
    <svg class="blob" viewBox="0 0 452 360" style="position:absolute;left:-56px;top:-72px;width:452px;height:360px">
      <path d="M44 0 C 190 -14, 352 22, 420 104 C 470 164, 436 258, 346 306
               C 248 358, 92 346, 26 282 C -30 228, -22 92, 44 0 Z" fill="#8a5a2b"/>
    </svg>
    <span class="web">NAMI-YAKIGASHI.JP</span>
    <div class="mk">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-58 -196 1076 392">
        <path d="M0 0 C 40.8 -107.5, 79.2 -107.5, 120 0 C 160.8 107.5, 199.2 107.5, 240 0
                 C 280.8 -107.5, 319.2 -107.5, 360 0 C 400.8 107.5, 439.2 107.5, 480 0
                 C 520.8 -107.5, 559.2 -107.5, 600 0 C 640.8 107.5, 679.2 107.5, 720 0
                 C 760.8 -107.5, 799.2 -107.5, 840 0 C 880.8 107.5, 919.2 107.5, 960 0"
              fill="none" stroke="#2b2621" stroke-width="58" stroke-linecap="round"/>
        <circle cx="0" cy="-141" r="29" fill="#2b2621"/>
        <circle cx="960" cy="141" r="29" fill="#2b2621"/>
      </svg>
    </div>
    <div class="rule"></div>
    <div class="jp">焼 菓 子 　 な み</div>
  </div>

  <!-- 裏 -->
  <div class="card back">
    <div class="nm">波多野 さと<em>H A T A N O 　 S A T O</em></div>
    <div class="rule"></div>
    <div class="ttl">焼き手</div>
    <div class="cols">
      <div class="adr">
        〒520-0000<br>
        滋賀県守山市〇〇 1-2-3<br>
        <b>木・金・土　11:00 — 17:00</b><br>
        売り切れ次第おしまいです
      </div>
      <div class="cnt">
        <b>077-000-0000</b>
        sato@nami-yakigashi.jp<br>
        nami-yakigashi.jp
      </div>
    </div>
    <div class="wave">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -120 1020 240">
        <path d="M0 0 C 40.8 -107.5, 79.2 -107.5, 120 0 C 160.8 107.5, 199.2 107.5, 240 0
                 C 280.8 -107.5, 319.2 -107.5, 360 0 C 400.8 107.5, 439.2 107.5, 480 0
                 C 520.8 -107.5, 559.2 -107.5, 600 0 C 640.8 107.5, 679.2 107.5, 720 0
                 C 760.8 -107.5, 799.2 -107.5, 840 0 C 880.8 107.5, 919.2 107.5, 960 0"
              fill="none" stroke="#8a5a2b" stroke-width="34" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
