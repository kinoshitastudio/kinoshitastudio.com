<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見本名刺（湖畔バス）</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 「湖畔バス」の名刺。
     ⭐ ロゴの【点＝バス停】を、名刺でも停留所として使う。裏は路線の1本を横に通して、
        その上に停留所の点を4つ置いた。渡した相手が「どこを走る会社か」を見て分かる。
     🔴 色は湖のグラデ1つだけ。地は白のまま。
     横型 91×55mm。*/
  *{box-sizing:border-box;margin:0;padding:0}
  body{ background:#555; padding:40px; font-family:'Noto Sans JP','Inter',sans-serif }
  .board{ width:1500px; height:1000px; background:#e9edf0; margin:0 auto; position:relative;
    overflow:hidden; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:58px; color:#0d2447 }
  .card{ width:685px; height:414px; position:relative; overflow:hidden; background:#fff;
    box-shadow:0 22px 40px rgba(10,40,80,.18), 0 2px 5px rgba(10,40,80,.10) }

  /* ── 表 ── */
  .face .mk{ position:absolute; left:50px; top:92px; width:206px }
  .face .mk svg{ width:100%; height:auto; display:block }
  .face .jp{ position:absolute; left:50px; top:244px; font-size:19px; font-weight:700;
    letter-spacing:.2em }
  .face .en{ position:absolute; left:52px; top:280px; font-size:10.5px; letter-spacing:.34em;
    color:#6d87a8; font-weight:600 }
  .face .line{ position:absolute; left:0; right:0; bottom:0; height:84px;
    background:linear-gradient(90deg,#0a2f86,#1676cf 55%,#22b8ee) }
  .face .line span{ position:absolute; bottom:24px; color:#fff; font-size:11.5px;
    letter-spacing:.16em; left:50px }
  .face .stops{ position:absolute; right:48px; top:96px; display:flex; flex-direction:column; gap:30px }
  .face .stops i{ display:block; width:15px; height:15px; border-radius:50%;
    background:#1676cf; position:relative }
  .face .stops i::after{ content:""; position:absolute; left:50%; top:15px; width:2px; height:30px;
    background:#cfe0ef; transform:translateX(-50%) }
  .face .stops i:last-child::after{ display:none }

  /* ── 裏 ── */
  .back{ padding:52px 50px 0 }
  .back .nm{ font-size:25px; font-weight:700; letter-spacing:.04em; line-height:1.3 }
  .back .nm em{ font-style:normal; display:block; font-size:11px; font-weight:500;
    letter-spacing:.24em; color:#6d87a8; margin-top:8px; font-family:'Inter' }
  .back .ttl{ font-size:12.5px; letter-spacing:.14em; color:#3d5c82; margin-top:16px }
  .back .cols{ display:flex; gap:44px; margin-top:26px }
  .back .adr{ font-size:12px; line-height:2; color:#243b58 }
  .back .cnt{ font-size:12.5px; line-height:2; color:#243b58 }
  .back .cnt b{ display:block; font-size:16px; font-weight:700; letter-spacing:.05em; color:#0d2447 }
  /* 路線 */
  .route{ position:absolute; left:0; right:0; bottom:54px; height:3px;
    background:linear-gradient(90deg,#0a2f86,#1676cf 55%,#22b8ee) }
  .route i{ position:absolute; top:50%; transform:translate(-50%,-50%); width:15px; height:15px;
    border-radius:50%; background:#fff; border:3px solid #1676cf }
  .route b{ position:absolute; top:22px; transform:translateX(-50%); font-size:9.5px;
    letter-spacing:.1em; color:#3d5c82; white-space:nowrap; font-weight:500 }

  .lbl{ position:absolute; font-size:13px; letter-spacing:.14em; color:#9fadba; font-weight:600 }
  .credit{ position:absolute; left:30px; bottom:16px; font-size:12px; letter-spacing:.12em; color:#aab6c1 }
</style>
</head>
<body>
<div class="board">
  <span class="lbl" style="left:30px; top:24px">BUSINESS CARD　／　91 × 55 mm</span>

  <div class="card face">
    <div class="mk">
      <svg viewBox="-10 -10 440 290">
        <defs><linearGradient id="lk" x1="0" y1="0" x2="1" y2="0.35">
          <stop offset="0" stop-color="#0a2f86"/><stop offset=".55" stop-color="#1676cf"/>
          <stop offset="1" stop-color="#22b8ee"/></linearGradient></defs>
        <rect x="0" y="20" width="70" height="230" rx="35" fill="url(#lk)"/>
        <path d="M70 150 C 70 90, 110 60, 160 60 C 160 120, 130 150, 70 150 Z" fill="url(#lk)"/>
        <path d="M70 150 C 120 150, 165 180, 165 250 C 110 250, 70 215, 70 150 Z" fill="url(#lk)"/>
        <circle cx="200" cy="232" r="18" fill="url(#lk)"/>
        <rect x="240" y="0" width="70" height="250" rx="35" fill="url(#lk)"/>
        <circle cx="330" cy="175" r="90" fill="url(#lk)"/>
        <circle cx="330" cy="175" r="32" fill="#fff"/>
      </svg>
    </div>
    <div class="jp">湖畔バス 株式会社</div>
    <div class="en">K O H A N　B U S　C O . , L T D .</div>
    <div class="stops"><i></i><i></i><i></i><i></i></div>
    <div class="line"><span>12 路線　／　滋賀県 湖西・湖南</span></div>
  </div>

  <div class="card back">
    <div class="nm">湖田 直人<em>K O D A 　 N A O T O</em></div>
    <div class="ttl">運行部／路線計画</div>
    <div class="cols">
      <div class="adr">
        〒520-0000<br>
        滋賀県大津市〇〇 1-2-3<br>
        湖畔バス 本社営業所
      </div>
      <div class="cnt">
        <b>077-000-0000</b>
        koda@kohan-bus.jp<br>
        kohan-bus.jp
      </div>
    </div>
    <div class="route">
      <i style="left:12%"></i><b style="left:12%">本社前</b>
      <i style="left:38%"></i><b style="left:38%">湖畔公園</b>
      <i style="left:64%"></i><b style="left:64%">市民会館</b>
      <i style="left:90%"></i><b style="left:90%">〇〇駅</b>
    </div>
  </div>

  <span class="credit">自主制作 / Kinoshita Studio —— 架空の会社です</span>
</div>
</body>
</html>
