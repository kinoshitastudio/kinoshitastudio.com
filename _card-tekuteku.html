<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見本名刺（てくてくひろば）</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 架空の「てくてくひろば」（こどもの遊び場）の名刺。
     ⭐ ロゴの3色をそのまま使う。裏は、歩いた足あとのように【点を散らして】並べた。
     🔴 こどもの施設なので角は丸く、字は大きく、小さい字は作らない。
     横型 91×55mm。*/
  *{box-sizing:border-box;margin:0;padding:0}
  body{ background:#555; padding:40px; font-family:'Noto Sans JP','Inter',sans-serif }
  .board{ width:1500px; height:1000px; background:#eef2f4; margin:0 auto; position:relative;
    overflow:hidden; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:58px; color:#17304a }
  .card{ width:685px; height:414px; position:relative; overflow:hidden; background:#fff;
    border-radius:14px; box-shadow:0 22px 40px rgba(20,50,80,.18), 0 2px 5px rgba(20,50,80,.10) }

  /* ── 表 ── */
  .face .mk{ position:absolute; left:50%; top:104px; transform:translateX(-50%); width:396px }
  .face .mk svg{ width:100%; height:auto; display:block }
  .face .jp{ position:absolute; left:0; right:0; bottom:88px; text-align:center;
    font-size:14px; font-weight:700; letter-spacing:.34em; color:#2a63b8; text-indent:.34em }
  .face .sub{ position:absolute; left:0; right:0; bottom:58px; text-align:center;
    font-size:11px; letter-spacing:.16em; color:#6b86a3 }
  .dots{ position:absolute; inset:0; pointer-events:none }
  .dots i{ position:absolute; border-radius:50%; display:block }

  /* ── 裏 ── */
  .back{ padding:50px 48px 0 }
  .back .nm{ font-size:26px; font-weight:900; letter-spacing:.03em; line-height:1.3 }
  .back .nm em{ font-style:normal; display:block; font-size:11px; font-weight:500;
    letter-spacing:.24em; color:#7e95ad; margin-top:8px; font-family:'Inter' }
  .back .ttl{ display:inline-block; margin-top:14px; background:#efa63a; color:#fff;
    font-size:11.5px; font-weight:700; letter-spacing:.14em; padding:5px 13px; border-radius:20px }
  .back .cols{ display:flex; gap:44px; margin-top:28px }
  .back .adr{ font-size:12px; line-height:2; color:#2b4663 }
  .back .adr b{ font-weight:700 }
  .back .cnt{ font-size:12.5px; line-height:2; color:#2b4663 }
  .back .cnt b{ display:block; font-size:16px; font-weight:700; letter-spacing:.05em; color:#17304a }
  .back .bar{ position:absolute; left:0; right:0; bottom:0; height:12px; display:flex }
  .back .bar i{ flex:1 } .back .bar i:nth-child(1){ background:#2a63b8 }
  .back .bar i:nth-child(2){ background:#7fc6e0 } .back .bar i:nth-child(3){ background:#efa63a }

  .lbl{ position:absolute; font-size:13px; letter-spacing:.14em; color:#9fadb8; font-weight:600 }
  .credit{ position:absolute; left:30px; bottom:16px; font-size:12px; letter-spacing:.12em; color:#aab6c0 }
</style>
</head>
<body>
<div class="board">
  <span class="lbl" style="left:30px; top:24px">BUSINESS CARD　／　91 × 55 mm</span>

  <div class="card face">
    <div class="dots" id="d"></div>
    <div class="mk">
      <svg viewBox="-20 -20 820 260" aria-label="てくてく">
        <defs>
          <g id="te" stroke-width="34" stroke-linecap="butt" fill="none">
            <path d="M20 50 H180" stroke="#7fc6e0"/>
            <path d="M120 50 C 60 70, 40 110, 50 150" stroke="#2a63b8"/>
            <path d="M50 150 C 60 180, 100 185, 140 180" stroke="#efa63a"/>
          </g>
          <g id="ku" stroke-width="34" stroke-linecap="butt" fill="none">
            <path d="M140 20 L60 100" stroke="#2a63b8"/>
            <path d="M60 100 L140 180" stroke="#7fc6e0"/>
          </g>
          <g id="eyes">
            <circle cx="0" cy="0" r="16" fill="#efa63a"/><circle cx="4" cy="2" r="6" fill="#111"/>
            <circle cx="40" cy="-10" r="16" fill="#7fc6e0"/><circle cx="44" cy="-8" r="6" fill="#111"/>
          </g>
        </defs>
        <use href="#te" x="0"/><use href="#ku" x="190"/><use href="#te" x="380"/><use href="#ku" x="570"/>
        <use href="#eyes" x="250" y="110"/>
      </svg>
    </div>
    <div class="jp">て く て く ひ ろ ば</div>
    <div class="sub">こどもと大人の、屋根のある広場　／　滋賀・草津</div>
  </div>

  <div class="card back">
    <div class="nm">竹田 みゆき<em>T A K E D A 　 M I Y U K I</em></div>
    <div class="ttl">ひろば の 人</div>
    <div class="cols">
      <div class="adr">
        〒520-0000<br>
        滋賀県草津市〇〇 1-2-3<br>
        <b>毎日 10:00 — 17:00</b><br>
        第3水曜はお休みです
      </div>
      <div class="cnt">
        <b>077-000-0000</b>
        miyuki@tekuteku.jp<br>
        tekuteku-hiroba.jp<br>
        予約は要りません
      </div>
    </div>
    <div class="bar"><i></i><i></i><i></i></div>
  </div>

</div>
<script>
// 歩いた跡。3色の点を、左下から右上へゆるく上がるように散らす
(function(){
  const box=document.getElementById('d'); if(!box) return;
  const col=['#2a63b8','#7fc6e0','#efa63a']; let h='';
  for(let i=0;i<34;i++){
    const t=i/33;
    const x=14+t*660+(Math.random()-.5)*40;
    const y=372-t*300+(Math.random()-.5)*70;
    const r=4+Math.random()*9;
    h+='<i style="left:'+x.toFixed(0)+'px;top:'+y.toFixed(0)+'px;width:'+r.toFixed(1)+'px;height:'
      +r.toFixed(1)+'px;background:'+col[i%3]+';opacity:'+(0.1+Math.random()*0.16).toFixed(2)+'"></i>';
  }
  box.innerHTML=h;
})();
</script>
</body>
</html>
