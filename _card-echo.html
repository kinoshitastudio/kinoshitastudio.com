<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見本名刺（エコー・レコード）</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 架空の「エコー・レコード」の名刺。
     ⭐ 表は白にロゴだけ。裏は黒にして、店名を【紙の四辺にばらして】置く。
        バラした字は読む順ではなく、紙を回したときに拾えるように配っている。
     🔴 色は黒と紙の白だけ。中古レコード店なので、字間は広く、線は1本も足さない。
     横型 91×55mm。*/
  *{box-sizing:border-box;margin:0;padding:0}
  body{ background:#555; padding:40px; font-family:'Inter','Noto Sans JP',sans-serif }
  .board{ width:1500px; height:1000px; background:#eceae6; margin:0 auto; position:relative;
    overflow:hidden; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:58px; color:#111 }

  /* 91×55mm を 685×414px で */
  .card{ width:685px; height:414px; position:relative; overflow:hidden;
    box-shadow:0 22px 40px rgba(20,20,20,.20), 0 2px 5px rgba(20,20,20,.12) }

  /* ── 表 ── */
  .face{ background:#fdfdfc }
  .face .mk{ position:absolute; left:50%; top:96px; transform:translateX(-50%); width:296px }
  .face .mk svg{ width:100%; height:auto; display:block }
  .face .en{ position:absolute; left:0; right:0; bottom:86px; text-align:center;
    font-weight:400; font-size:11px; letter-spacing:.56em; color:#111; text-indent:.56em }

  /* ── 裏 ── */
  .back{ background:#111; color:#fdfdfc }
  .back .nm{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; font-family:'Noto Sans JP'; font-weight:500; font-size:22px;
    letter-spacing:.18em }
  .back .nm em{ display:block; font-style:normal; font-size:10.5px; font-weight:400;
    letter-spacing:.34em; color:#9b9893; margin-top:11px }
  .back .cnt{ position:absolute; left:36px; top:36px; font-size:10.5px; line-height:1.95;
    letter-spacing:.13em; color:#fdfdfc }
  /* 店名を四辺へ。上＝エ、右＝コー、下＝レコード、左＝ド */
  .back .s1{ position:absolute; right:36px; top:36px; writing-mode:vertical-rl;
    font-family:'Noto Sans JP'; font-size:11px; letter-spacing:.54em; color:#fdfdfc }
  .back .s2{ position:absolute; left:36px; bottom:34px; writing-mode:vertical-rl;
    font-family:'Noto Sans JP'; font-size:11px; letter-spacing:.54em; color:#fdfdfc }
  .back .s3{ position:absolute; right:36px; bottom:32px; font-family:'Noto Sans JP';
    font-size:11px; letter-spacing:.54em; color:#fdfdfc; text-indent:.54em }

  .lbl{ position:absolute; font-size:13px; letter-spacing:.14em; color:#a5a29c; font-weight:600 }
  .credit{ position:absolute; left:30px; bottom:16px; font-size:12px; letter-spacing:.12em; color:#b3b0aa }
</style>
</head>
<body>
<div class="board">
  <span class="lbl" style="left:30px; top:24px">BUSINESS CARD　／　91 × 55 mm</span>

  <!-- 表 -->
  <div class="card face">
    <div class="mk">
      <svg width="1100" height="640" viewBox="-50 0 1100 640" aria-label="エコー・レコード">
        <g fill="#111" stroke="#111" stroke-width="14" stroke-linejoin="round">
          <g transform="translate(100 40) skewX(-14)">
            <rect x="24" y="0" width="156" height="50"/><rect x="76" y="0" width="54" height="220"/><rect x="0" y="170" width="204" height="50"/>
            <g transform="translate(266 0)"><rect x="0" y="0" width="196" height="50"/><rect x="144" y="0" width="52" height="220"/><rect x="0" y="170" width="196" height="50"/></g>
            <g transform="translate(530 0)"><rect x="0" y="88" width="170" height="50"/></g>
            <circle cx="740" cy="112" r="20" stroke="none"/>
          </g>
          <g transform="translate(20 330) skewX(-14)">
            <g><rect x="16" y="0" width="56" height="220"/><polygon points="72,220 72,160 172,40 196,40 196,110 130,220"/></g>
            <g transform="translate(260 0)"><rect x="0" y="0" width="196" height="50"/><rect x="144" y="0" width="52" height="220"/><rect x="0" y="170" width="196" height="50"/></g>
            <g transform="translate(518 0)"><rect x="0" y="88" width="160" height="50"/></g>
            <g transform="translate(712 0)">
              <rect x="30" y="0" width="56" height="220"/>
              <polygon points="86,96 104,78 196,136 178,172"/>
              <rect x="150" y="-24" width="20" height="44" transform="rotate(14 160 -2)"/>
              <rect x="186" y="-24" width="20" height="44" transform="rotate(14 196 -2)"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <div class="en">E C H O　R E C O R D S</div>
  </div>

  <!-- 裏 -->
  <div class="card back">
    <div class="cnt">
      077-000-0000<br>
      NAKA@ECHO-RECORDS.JP<br>
      ECHO-RECORDS.JP
    </div>
    <div class="s1">中 古 盤 ・ 買 取</div>
    <div class="s2">滋 賀 ・ 大 津</div>
    <div class="s3">エ コ ー ・ レ コ ー ド</div>
    <div class="nm">中尾 和久<em>N A K A O 　 K A Z U H I S A</em></div>
  </div>

  <span class="credit">自主制作 / Kinoshita Studio —— 架空の店です</span>
</div>
</body>
</html>
