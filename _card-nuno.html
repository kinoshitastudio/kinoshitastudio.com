<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見本名刺（布の店 nuno）</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 「布の店 nuno」の名刺。
     ⭐ ロゴは織りの縦横。名刺では【その織りを地に薄く敷く】。近づくと布に見える。
     🔴 色は墨1色。織りの線は 0.5px 相当まで細くして、字の邪魔をしない。
     横型 91×55mm。*/
  *{box-sizing:border-box;margin:0;padding:0}
  body{ background:#555; padding:40px; font-family:'Noto Sans JP','Inter',sans-serif }
  .board{ width:1500px; height:1000px; background:#eae7e0; margin:0 auto; position:relative;
    overflow:hidden; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:58px; color:#231f20 }
  .card{ width:685px; height:414px; position:relative; overflow:hidden; background:#faf8f3;
    box-shadow:0 22px 40px rgba(50,44,36,.18), 0 2px 5px rgba(50,44,36,.1) }
  /* 織り */
  /* 🔴 縦横を同じにすると方眼紙に見える。布は縦糸と横糸で太さも間隔も違う */
  .weave{ position:absolute; inset:0; background-image:
      repeating-linear-gradient(90deg,rgba(35,31,32,.105) 0 1.2px,transparent 1.2px 7.5px),
      repeating-linear-gradient(0deg,rgba(35,31,32,.042) 0 0.6px,transparent 0.6px 3.2px) }

  .face .mk{ position:absolute; left:50%; top:132px; transform:translateX(-50%); width:300px }
  .face .mk svg{ width:100%; height:auto; display:block }
  .face .jp{ position:absolute; left:0; right:0; bottom:96px; text-align:center; font-size:13px;
    letter-spacing:.42em; text-indent:.42em }
  .face .en{ position:absolute; left:0; right:0; bottom:66px; text-align:center; font-size:10px;
    letter-spacing:.26em; color:#7a736a; text-indent:.26em }
  .face .cut{ position:absolute; left:0; right:0; bottom:0; height:10px;
    background:repeating-linear-gradient(90deg,#231f20 0 5px,transparent 5px 11px); opacity:.5 }

  .back{ padding:50px 48px 0 }
  .back .nm{ font-size:25px; font-weight:700; letter-spacing:.05em; line-height:1.3 }
  .back .nm em{ font-style:normal; display:block; font-size:11px; font-weight:500;
    letter-spacing:.24em; color:#7a736a; margin-top:8px; font-family:'Inter' }
  .back .ttl{ font-size:12px; letter-spacing:.18em; color:#4d463e; margin-top:16px }
  .back .cols{ display:flex; gap:44px; margin-top:26px }
  .back .adr{ font-size:12px; line-height:2; color:#332e29 }
  .back .adr b{ font-weight:700 }
  .back .cnt{ font-size:12.5px; line-height:2; color:#332e29 }
  .back .cnt b{ display:block; font-size:16px; font-weight:700; letter-spacing:.05em; color:#231f20 }
  .back .mk{ position:absolute; right:44px; bottom:34px; width:108px; opacity:.5 }
  .back .mk svg{ width:100%; height:auto; display:block }
  .lbl{ position:absolute; font-size:13px; letter-spacing:.14em; color:#a7a39a; font-weight:600 }
  .credit{ position:absolute; left:30px; bottom:16px; font-size:12px; letter-spacing:.12em; color:#b4b0a7 }
</style>
</head>
<body>
<div class="board">
  <span class="lbl" style="left:30px; top:24px">BUSINESS CARD　／　91 × 55 mm</span>

  <div class="card face">
    <div class="weave"></div>
    <div class="mk"><svg viewBox="-20 -269.77910687405836 714.1 309.77910687405836"><g fill="none" stroke="#231f20" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0.0,0.0)"><path d="M0 0 V-58.9 M0 -34.1 C 6.2 -83.7, 117.8 -89.89999999999999, 117.8 -31.0 V0"/></g><g transform="translate(151.9,-29.5)"><path d="M0 -58.9 V-27.900000000000002 C 0 13.64, 117.8 13.64, 117.8 -27.900000000000002 V-58.9 M117.8 -27.900000000000002 V0"/></g><g transform="translate(303.8,-59.1)"><path d="M0 0 V-58.9 M0 -34.1 C 6.2 -83.7, 117.8 -89.89999999999999, 117.8 -31.0 V0"/></g><g transform="translate(455.7,-88.6)"><path d="M0.0 -27.28 C -4.340000000000003 -75.64, 120.9 -80.6, 117.8 -32.24 C 120.9 14.880000000000003, -1.8599999999999994 18.6, 0.0 -27.28 z"/></g></g><circle cx="618.1" cy="-189.0" r="18.6" fill="none" stroke="#231f20" stroke-width="16.0"/></svg></div>
    <div class="jp">布 の 店</div>
    <div class="en">N U N O　／　滋 賀 ・ 彦 根</div>
    <div class="cut"></div>
  </div>

  <div class="card back">
    <div class="weave" style="opacity:.62"></div>
    <div class="nm">布谷 瑞希<em>N U N O T A N I 　 M I Z U K I</em></div>
    <div class="ttl">店 主</div>
    <div class="cols">
      <div class="adr">
        〒520-0000<br>
        滋賀県彦根市〇〇 1-2-3<br>
        <b>金・土・日　11:00 — 17:00</b><br>
        10cm から切り売りします
      </div>
      <div class="cnt">
        <b>0749-00-0000</b>
        mizuki@nuno-ten.jp<br>
        nuno-ten.jp
      </div>
    </div>
    <div class="mk"><svg viewBox="-20 -269.77910687405836 714.1 309.77910687405836"><g fill="none" stroke="#231f20" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0.0,0.0)"><path d="M0 0 V-58.9 M0 -34.1 C 6.2 -83.7, 117.8 -89.89999999999999, 117.8 -31.0 V0"/></g><g transform="translate(151.9,-29.5)"><path d="M0 -58.9 V-27.900000000000002 C 0 13.64, 117.8 13.64, 117.8 -27.900000000000002 V-58.9 M117.8 -27.900000000000002 V0"/></g><g transform="translate(303.8,-59.1)"><path d="M0 0 V-58.9 M0 -34.1 C 6.2 -83.7, 117.8 -89.89999999999999, 117.8 -31.0 V0"/></g><g transform="translate(455.7,-88.6)"><path d="M0.0 -27.28 C -4.340000000000003 -75.64, 120.9 -80.6, 117.8 -32.24 C 120.9 14.880000000000003, -1.8599999999999994 18.6, 0.0 -27.28 z"/></g></g><circle cx="618.1" cy="-189.0" r="18.6" fill="none" stroke="#231f20" stroke-width="16.0"/></svg></div>
  </div>

  <span class="credit">自主制作 / Kinoshita Studio —— 架空の店です</span>
</div>
</body>
</html>
